# Calidad en cada push y en cada pull request: build (TypeScript + Vite), los
# tests del motor y las dos simulaciones, en corridas cortas. El deploy a
# GitHub Pages es aparte (deploy.yml) y sólo corre sobre main.
name: CI

on:
  push:
    branches-ignore: [gh-pages]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build (tsc + vite)
        run: npm run build
      - name: Tests del motor
        run: npm test
      - name: Balance (20 temporadas por estrategia)
        run: npm run sim -- 20
      - name: Pirámide y ligas (4 carreras × 4 temporadas)
        run: npm run sim:ligas -- 4 4
