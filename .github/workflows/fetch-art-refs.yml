          s2-13-sintesis-referencias.webp hf_20260719_205314_55b19e37-725e-43a2-96de-8486f33d2e1a_min.webp
          EOF
      - name: Commit to the art branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add design/references/higgsfield-2026-07
          git commit -m "Referencias Higgsfield jul-2026 (bajadas por Actions: el entorno de sesión no llega al CDN)"
          git push origin claude/game-art-design-yyn2yu
