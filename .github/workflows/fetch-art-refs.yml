          s2-07-ficha-jugador-b.webp hf_20260719_192529_5757c9df-92ee-4d6e-91d8-2789cdf71d2d_min.webp
          s2-08-ficha-jugador-c.webp hf_20260719_192834_ab80c5f4-6b9f-465f-980b-2f7b25a66195_min.webp
          s2-09-plantel-caricatura.webp hf_20260719_194348_b9cc1a6f-27c7-494e-aa13-808e8e59d2f2_min.webp
          s2-10-plantel-a.webp hf_20260719_194718_88e0f1d5-f6b7-46af-adfb-91cf943f3b21_min.webp
          s2-11-plantilla-b.webp hf_20260719_201439_0858aad0-f4eb-4dd3-9f99-0273b999e6b7_min.webp
